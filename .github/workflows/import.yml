name: Import watchlist

# Run manually (Actions tab -> Import watchlist -> Run workflow) after editing my_watchlist.json.
# Adds/replaces those watches and looks up their past prices.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozb-check
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 ozb_alert.py import my_watchlist.json
          python3 ozb_alert.py list
          git add STATUS.md
          git diff --staged --quiet || (git commit -q -m "Update status [skip ci]" && git pull --rebase -q && git push -q)
